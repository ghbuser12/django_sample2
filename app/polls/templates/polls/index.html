<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>備品管理システム</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: sans-serif;
      background-color: #1e1e1e;
      color: #fff;
      padding: 20px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header .user {
      font-size: 18px;
    }
    .nav-buttons {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .nav-buttons button {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      background-color: #ffe6cc;
      color: #333;
      cursor: pointer;
    }
    .section {
      margin-top: 30px;
    }
    .section h2 {
      margin-bottom: 10px;
    }
    .polls ul {
      list-style: none;
      padding: 0;
    }
    .polls li a {
      color: #00bfff;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="user">草薙素子</div>
    <div class="nav-buttons">
      <button onclick="location.href='/'">HOME</button>
      <button onclick="location.href='/logout'">ログアウト</button>
    </div>
  </div>

  <div class="section">
    <h2>貸出/返却</h2>
    <div class="nav-buttons">
      <button>QRコードを読み取る</button>
      <button>備品一覧から選択する</button>
    </div>
  </div>

  <div class="section polls">
    <h2>アンケート一覧</h2>
    <ul>
      <li><a href="/polls/1">プロジェクターの利用について</a></li>
      <li><a href="/polls/2">会議室の予約方法</a></li>
    </ul>
  </div>

</body>
</html>
